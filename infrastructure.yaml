AWSTemplateFormatVersion: '2010-09-09'
Description: 'VPC and networking infrastructure for kilo4 - foundational networking layer with public subnet and internet connectivity in us-east-2'

Parameters:
  SSHAllowedIP:
    Type: String
    Description: IP address in CIDR notation allowed to SSH to the instance (e.g., 1.2.3.4/32)
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$'
    ConstraintDescription: Must be a valid IP address in CIDR notation (e.g., 1.2.3.4/32)

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: SSM Parameter for latest Amazon Linux 2023 ARM64 AMI
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: kilo4-VPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: kilo4-IGW

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: us-east-2a
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: kilo4-PublicSubnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: kilo4-PublicRouteTable

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  AnsiblePlaybooksBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'kilo4-ansible-playbooks-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: kilo4-ansible-playbooks

  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kilo4-EC2-SSM-SES-Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: SESEmailPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                  - ses:GetSendQuota
                Resource: arn:aws:ses:us-east-2:*:identity/*
        - PolicyName: S3PlaybookAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt AnsiblePlaybooksBucket.Arn
                  - !Sub '${AnsiblePlaybooksBucket.Arn}/*'
      Tags:
        - Key: Name
          Value: kilo4-EC2-SSM-SES-Role

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: kilo4-EC2-InstanceProfile
      Roles:
        - !Ref EC2Role

  SSHSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH from specific IP only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHAllowedIP
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: kilo4-SSH-SecurityGroup

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: t4g.small
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref SSHSecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      UserData:
        Fn::Base64: |
          #!/bin/bash
          mkdir -p /home/ec2-user/.ssh
          curl -s https://github.com/geowa4.keys >> /home/ec2-user/.ssh/authorized_keys
          chown -R ec2-user:ec2-user /home/ec2-user/.ssh
          chmod 700 /home/ec2-user/.ssh
          chmod 600 /home/ec2-user/.ssh/authorized_keys
      Tags:
        - Key: Name
          Value: kilo4-Instance
        - Key: Patch Group
          Value: AmazonLinux2023

  SESBouncesTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: kilo4-ses-bounces
      DisplayName: SES Bounce Notifications
      Tags:
        - Key: Name
          Value: kilo4-ses-bounces

  SESComplaintsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: kilo4-ses-complaints
      DisplayName: SES Complaint Notifications
      Tags:
        - Key: Name
          Value: kilo4-ses-complaints

  SESHighBounceRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kilo4-ses-high-bounce-rate
      AlarmDescription: Alert when SES bounce rate exceeds 5%
      MetricName: Reputation.BounceRate
      Namespace: AWS/SES
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0.05
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  SESHighComplaintRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kilo4-ses-high-complaint-rate
      AlarmDescription: Alert when SES complaint rate exceeds 0.1%
      MetricName: Reputation.ComplaintRate
      Namespace: AWS/SES
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0.001
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  AnsiblePlaybooksBucketName:
    Value: !Ref AnsiblePlaybooksBucket
    Description: S3 bucket name for Ansible playbooks
  AnsiblePlaybooksBucketArn:
    Value: !GetAtt AnsiblePlaybooksBucket.Arn
    Description: S3 bucket ARN for Ansible playbooks
  InstanceId:
    Value: !Ref EC2Instance
    Description: EC2 Instance ID for SSM commands
  SESBouncesTopicArn:
    Value: !Ref SESBouncesTopic
    Description: SNS Topic ARN for SES bounce notifications
  SESComplaintsTopicArn:
    Value: !Ref SESComplaintsTopic
    Description: SNS Topic ARN for SES complaint notifications
