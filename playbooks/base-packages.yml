---
- name: Install base development packages
  hosts: localhost
  become: true

  vars:
    base_packages:
      - git
    go_version: "1.25.2"
    go_arch: "linux-arm64"
    claude_binary: /home/ec2-user/.local/bin/claude

  tasks:
    - name: Install base development packages
      ansible.builtin.dnf:
        name: "{{ base_packages }}"
        state: present

    # Install Go from official binaries (newer than dnf package)
    - name: Check if Go is installed with correct version
      ansible.builtin.command: /usr/local/go/bin/go version
      register: go_version_check
      failed_when: false
      changed_when: false

    - name: Install Go from official binaries
      when: go_version_check.rc != 0 or go_version not in go_version_check.stdout
      block:
        - name: Download Go binary
          ansible.builtin.get_url:
            url: "https://go.dev/dl/go{{ go_version }}.{{ go_arch }}.tar.gz"
            dest: /tmp/go.tar.gz
            mode: "0644"

        - name: Remove old Go installation
          ansible.builtin.file:
            path: /usr/local/go
            state: absent

        - name: Extract Go binary
          ansible.builtin.unarchive:
            src: /tmp/go.tar.gz
            dest: /usr/local
            remote_src: true

        - name: Clean up Go download
          ansible.builtin.file:
            path: /tmp/go.tar.gz
            state: absent

        - name: Add Go to PATH
          ansible.builtin.copy:
            content: |
              export PATH=$PATH:/usr/local/go/bin
            dest: /etc/profile.d/go.sh
            mode: "0644"

    # Claude Code installation skipped due to RAM constraints on t4g.small
    # Install manually if needed: curl -sS https://claude.ai/install.sh | bash
