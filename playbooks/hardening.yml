---
- name: Harden Amazon Linux 2023 instance
  hosts: localhost
  become: true

  vars:
    sshd_config_path: /etc/ssh/sshd_config
    fail2ban_bantime: 1h
    fail2ban_maxretry: 3
    fail2ban_findtime: 10m

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: sshd
        state: restarted

    - name: Reload firewalld
      ansible.builtin.service:
        name: firewalld
        state: reloaded

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

  tasks:
    # SSH Hardening
    - name: Disable SSH root login
      ansible.builtin.lineinfile:
        path: "{{ sshd_config_path }}"
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart sshd

    - name: Disable SSH password authentication
      ansible.builtin.lineinfile:
        path: "{{ sshd_config_path }}"
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart sshd

    # Firewall Configuration
    - name: Install firewalld
      ansible.builtin.dnf:
        name: firewalld
        state: present

    - name: Enable and start firewalld
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Set default zone to drop
      ansible.builtin.command:
        cmd: firewall-cmd --set-default-zone=drop
      register: firewall_default_zone
      changed_when: "'ZONE_ALREADY_SET' not in firewall_default_zone.stderr"
      notify: Reload firewalld

    - name: Allow SSH in drop zone
      ansible.posix.firewalld:
        zone: drop
        service: ssh
        permanent: true
        state: enabled
      notify: Reload firewalld

    # fail2ban Configuration
    - name: Install fail2ban
      ansible.builtin.dnf:
        name: fail2ban
        state: present

    - name: Create fail2ban jail.local for sshd
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        content: |
          [DEFAULT]
          bantime = {{ fail2ban_bantime }}
          findtime = {{ fail2ban_findtime }}
          maxretry = {{ fail2ban_maxretry }}

          [sshd]
          enabled = true
          port = ssh
          logpath = /var/log/secure
          backend = systemd
        owner: root
        group: root
        mode: '0644'
      notify: Restart fail2ban

    - name: Enable and start fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true
